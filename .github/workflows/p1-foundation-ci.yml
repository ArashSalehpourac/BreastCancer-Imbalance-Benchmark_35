name: P1 Foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [p1/reproducibility-foundation]

jobs:
  foundation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install foundation package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run non-result-bearing foundation tests
        run: python -m unittest discover -s tests -v
